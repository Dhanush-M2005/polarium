<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Dhruv AI Chatbot Avatar">
  <defs>
    <linearGradient id="chat-bot-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061b36" />
      <stop offset="50%" stop-color="#082b57" />
      <stop offset="100%" stop-color="#0c4a79" />
    </linearGradient>

    <linearGradient id="chat-visor-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="chat-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="chat-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Outer Chat Bubble Base Shield -->
  <path d="M 60 8 C 28 8 10 26 10 56 C 10 74 20 88 36 96 L 28 112 L 52 103 C 55 104 57 104 60 104 C 92 104 110 86 110 56 C 110 26 92 8 60 8 Z" fill="url(#chat-bot-bg)" stroke="url(#chat-gold)" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Inner Accent Bubble Border -->
  <path d="M 60 13 C 32 13 15 29 15 56 C 15 72 24 84 38 91 L 32 104 L 52 97 C 54 98 57 98 60 98 C 88 98 105 82 105 56 C 105 29 88 13 60 13 Z" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.25" />

  <!-- 2. Polar AI Chatbot Visor (Futuristic Curved Faceplate) -->
  <rect x="28" y="36" width="64" height="38" rx="19" fill="url(#chat-visor-cyan)" filter="url(#chat-glow)" />
  <rect x="31" y="39" width="58" height="32" rx="16" fill="#041226" />

  <!-- Intelligent AI LED Eyes (Twin Optics) -->
  <circle cx="46" cy="55" r="7.5" fill="url(#chat-visor-cyan)" />
  <circle cx="46" cy="55" r="3.5" fill="#ffffff" />
  <circle cx="48" cy="53" r="1.5" fill="#ffffff" />

  <circle cx="74" cy="55" r="7.5" fill="url(#chat-visor-cyan)" />
  <circle cx="74" cy="55" r="3.5" fill="#ffffff" />
  <circle cx="76" cy="53" r="1.5" fill="#ffffff" />

  <!-- Central AI Soundwave / Telemetry LED Pulse -->
  <path d="M 57 55 L 63 55" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />

  <!-- 3. Top Headset Antenna: DHRUVA POLE STAR -->
  <g filter="url(#chat-glow)">
    <line x1="60" y1="36" x2="60" y2="21" stroke="url(#chat-gold)" stroke-width="3" stroke-linecap="round" />
    <polygon points="60,10 62.5,20 72.5,22.5 62.5,25 60,35 57.5,25 47.5,22.5 57.5,20" fill="url(#chat-gold)" />
    <circle cx="60" cy="22.5" r="2.5" fill="#ffffff" />
  </g>

  <!-- 4. Ice Crystal / Polar Sparkle Accents -->
  <polygon points="98,28 100,34 106,36 100,38 98,44 96,38 90,36 96,34" fill="url(#chat-gold)" />
  <circle cx="22" cy="30" r="2" fill="#38bdf8" />
</svg>
